<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page introuvable - DataJM</title>
    <meta name="robots" content="noindex">
    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="stylesheet" href="/tailwind.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Navigation -->
    <nav class="w-full bg-white/90 backdrop-blur-md border-b border-slate-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <a href="/" class="flex items-center gap-2">
                    <img src="/logo-datajm.webp" alt="DataJM - Consultant Expert Data SAP" width="131" height="96" class="h-12 w-auto">
                </a>
                <a href="/" class="text-slate-600 hover:text-blue-700 font-medium transition flex items-center gap-2">
                    <i class="ph ph-arrow-left"></i> Retour à l'accueil
                </a>
            </div>
        </div>
    </nav>

    <!-- 404 Content -->
    <main class="flex-1 flex items-center justify-center px-4 py-20">
        <div class="text-center max-w-xl">
            <p class="text-blue-600 font-bold tracking-wider uppercase text-sm mb-4">Erreur 404</p>
            <h1 class="text-5xl md:text-6xl font-bold text-slate-900 mb-6 tracking-tight">Page introuvable</h1>
            <p class="text-lg text-slate-600 mb-10 leading-relaxed">
                Oups ! La page que vous cherchez n'existe pas ou a été déplacée.
            </p>
            <div class="flex flex-col sm:flex-row justify-center gap-4">
                <a href="/"
                    class="bg-blue-700 hover:bg-blue-800 text-white px-8 py-4 rounded-full font-bold transition shadow-lg shadow-blue-700/20">
                    Retour à l'accueil
                </a>
                <a href="/#contact"
                    class="px-8 py-4 rounded-full font-bold text-blue-700 border border-blue-200 hover:bg-blue-50 transition">
                    Me contacter
                </a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-8">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="text-slate-500 text-sm">
                &copy; <span id="footer-year">2026</span> DataJM. Tous droits réservés.
            </p>
        </div>
    </footer>

    <script>
        document.getElementById('footer-year').textContent = new Date().getFullYear();
    </script>
</body>

</html>
