<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page introuvable - DataJM</title>
    <meta name="robots" content="noindex">
    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="stylesheet" href="/tailwind.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-950 text-slate-300 antialiased min-h-screen flex flex-col">

    <!-- Navigation -->
    <nav class="w-full bg-slate-950/70 backdrop-blur-xl border-b border-white/10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <a href="/" class="flex items-center gap-3">
                    <span class="bg-white rounded-xl p-1.5 shadow-lg shadow-cyan-500/10">
                        <img src="/logo-datajm.webp" alt="DataJM - Consultant Expert Data SAP" width="131" height="96" class="h-9 w-auto">
                    </span>
                </a>
                <a href="/" class="text-slate-300 hover:text-white font-medium transition flex items-center gap-2">
                    <i class="ph ph-arrow-left" aria-hidden="true"></i> Retour à l'accueil
                </a>
            </div>
        </div>
    </nav>

    <!-- 404 Content -->
    <main class="flex-1 flex items-center justify-center px-4 py-20 relative overflow-hidden">
        <div class="absolute top-1/4 left-1/2 -translate-x-1/2 w-[560px] h-[560px] rounded-full bg-blue-600/15 blur-3xl -z-10" aria-hidden="true"></div>
        <div class="text-center max-w-xl">
            <p class="text-cyan-400 font-semibold tracking-widest uppercase text-xs mb-4">Erreur 404</p>
            <h1 class="font-display text-5xl md:text-7xl font-bold text-white mb-6 tracking-tight">Page introuvable</h1>
            <p class="text-lg text-slate-400 mb-10 leading-relaxed">
                Oups ! La page que vous cherchez n'existe pas ou a été déplacée.
            </p>
            <div class="flex flex-col sm:flex-row justify-center gap-4">
                <a href="/"
                    class="inline-flex items-center justify-center gap-2 bg-gradient-to-r from-blue-500 to-cyan-400 hover:from-blue-400 hover:to-cyan-300 text-slate-950 px-8 py-4 rounded-full font-bold transition shadow-lg shadow-cyan-500/25">
                    Retour à l'accueil
                </a>
                <a href="/#contact"
                    class="inline-flex items-center justify-center px-8 py-4 rounded-full font-bold text-white border border-white/15 bg-white/5 hover:bg-white/10 transition">
                    Me contacter
                </a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-white/10 py-8">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="text-slate-500 text-sm">
                &copy; <span id="footer-year">2026</span> DataJM. Tous droits réservés.
            </p>
        </div>
    </footer>

    <script>
        document.getElementById('footer-year').textContent = new Date().getFullYear();
    </script>
</body>

</html>
